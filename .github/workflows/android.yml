name: Android CI

on:
  push:
    branches: [ main, genspark_ai_developer ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
    
    - name: Build Debug APK
      run: ./gradlew assembleDebug
    
    - name: Upload Debug APK
      uses: actions/upload-artifact@v3
      with:
        name: echo-companion-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
    
    - name: Generate Build Report
      if: always()
      run: |
        echo "## Build Information" > build-report.md
        echo "**Build Date**: $(date)" >> build-report.md
        echo "**Commit**: ${{ github.sha }}" >> build-report.md
        echo "**Branch**: ${{ github.ref_name }}" >> build-report.md
        echo "" >> build-report.md
        
        if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
          APK_SIZE=$(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)
          echo "**APK Size**: $APK_SIZE" >> build-report.md
          echo "**Status**: ✅ Build Successful" >> build-report.md
        else
          echo "**Status**: ❌ Build Failed" >> build-report.md
        fi
    
    - name: Upload Build Report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: build-report
        path: build-report.md
        retention-days: 7

  test:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
    
    - name: Run Unit Tests
      run: ./gradlew test
    
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results
        path: app/build/reports/tests/
        retention-days: 7